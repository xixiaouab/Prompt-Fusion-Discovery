[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-fusion-discovery"
version = "0.1.0"
description = "Layer-specific prompt fusion search for frozen vision transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4", "torchvision>=0.19", "timm>=1.0.15,<1.1", "numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["prompt_fusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

